name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q device gateway
      - name: Smoke test
        env:
          AGENT_TOKEN: ci-test-token
        run: |
          cp .env.example .env
          python - <<'PY'
          from fastapi.testclient import TestClient
          from device.main import app

          client = TestClient(app)

          # 健康检查公开
          health = client.get("/api/health")
          assert health.status_code == 200 and health.json()["ok"] is True

          # 鉴权：无令牌 401
          assert client.get("/api/sessions").status_code == 401
          assert client.get("/api/agents").status_code == 401

          # 带令牌 200
          auth = {"Authorization": "Bearer ci-test-token"}
          assert client.get("/api/sessions", headers=auth).status_code == 200
          assert client.get("/api/agents", headers=auth).status_code == 200
          assert client.get("/api/skills", headers=auth).status_code == 200

          # 无 Key 时为演示模式，仍应 200
          chat = client.post("/api/chat", headers=auth,
                             json={"session_id": "ci", "messages": [{"role": "user", "content": "hi"}]})
          assert chat.status_code == 200
          print("smoke ok")
          PY
