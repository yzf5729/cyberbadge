<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberBadge</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css?v=10">
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="dot"></span> CyberBadge</div>
  <div class="status" id="status">连接中…</div>
</header>
<nav id="agents" class="agents" aria-label="agents"></nav>
<div id="views"></div>
<footer>
  <textarea id="input" rows="1" placeholder="让 agent 做点什么…（回车发送）"></textarea>
  <button id="send" aria-label="发送">↑</button>
</footer>
<div id="modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head"><span>Agent 信息</span><button id="modal-close" aria-label="关闭">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<script src="/app.js?v=10"></script>
</body>
</html>
